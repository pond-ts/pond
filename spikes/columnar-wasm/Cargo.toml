[package]
name = "pond-columnar"
version = "0.0.0-spike"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# A second profile for the "how small can it get" datapoint in the report.
[profile.small]
inherits = "release"
opt-level = "z"
