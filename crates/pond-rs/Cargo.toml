[package]
name = "pond-rs"
version = "0.0.0"
description = "Time series analytics: a native Rust implementation of pond"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published until R1 lands something worth using.
publish = false

[dependencies]
arrow-array = { version = "59.3.1", default-features = false }
arrow-buffer = { version = "59.3.1", default-features = false }
arrow-ipc = { version = "59.3.1", default-features = false }
arrow-schema = { version = "59.3.1", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "0.1.9" # same crate jiff bundles; read only for its VERSION

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: fixture numbers must parse to the exact f64 pond-ts wrote.
# preserve_order: mapping objects keep their key order (it sets column order).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
