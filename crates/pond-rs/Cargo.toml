[package]
name = "pond-rs"
version = "0.0.0"
description = "Time series analytics: a native Rust implementation of pond"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published until R1 lands something worth using.
publish = false

[dependencies]
arrow-array = { version = "59.3.1", default-features = false }
arrow-buffer = { version = "59.3.1", default-features = false }
# lz4 and zstd: read compressed IPC (pandas `to_feather` writes LZ4 by default).
# zstd is C code; it builds for wasm32 with clang and needs no imports there.
arrow-ipc = { version = "59.3.1", default-features = false, features = ["lz4", "zstd"] }
arrow-schema = { version = "59.3.1", default-features = false }
# Already built for arrow-ipc; its `take` gathers text rows fast.
arrow-select = { version = "59.3.1", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "0.1.9" # same crate jiff bundles; read only for its VERSION
# Unicode collation (CLDR root, as JavaScript's `localeCompare` in Node):
# `join` orders interval labels that share a span the way pond-ts does.
icu_collator = "2.3.1"
# pond-ts's JSON wire format (`from_json` / `to_json`). float_roundtrip: read
# numbers to the exact f64 JavaScript reads. Cargo turns a feature on for
# every crate in a build, so this also makes other crates' serde_json number
# parsing exact (and a little slower); no other feature is enabled.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The JSON readers parse into their own light tree (`json_text.rs`), which
# serde builds (serde_json already depends on it).
serde = "1"
# Shortest digits for numbers in `to_json` (serde_json already depends on it).
zmij = "1"

# Threads are not available on wasm32, so rayon is never built there; the
# `parallel` feature then does nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
# Work on independent output columns runs on several cores (rayon's pool;
# RAYON_NUM_THREADS sets its size). Results are the same bits either way:
# each column is still computed start to finish by one thread.
parallel = ["dep:rayon"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: fixture numbers must parse to the exact f64 pond-ts wrote.
# preserve_order: mapping objects keep their key order (it sets column order).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
