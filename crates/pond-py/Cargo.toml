[package]
name = "pond-py"
version = "0.76.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Not needed to build the package; keeps them out of the sdist.
exclude = ["agent-trial", "bench"]

[lib]
name = "pond_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pond-rs = { path = "../pond-rs" }
pyo3 = { version = "0.29", features = ["abi3-py39", "multiple-pymethods"] }
arrow-pyarrow = "59.3.2"
arrow-array = { version = "59.3.1", default-features = false, features = ["ffi"] }
mimalloc = { version = "0.1", default-features = false }
