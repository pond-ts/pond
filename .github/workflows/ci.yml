name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger — lets `verify` be run on demand (e.g. when push/PR event
  # delivery is disrupted, as after the pond-ts/pond org transfer). Mirrors the
  # workflow_dispatch the charts-e2e workflow already has.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 24.x
        # One leg runs east of UTC. Chart formatters render in the runner's
        # **local** zone, so a test pinning a `Date.UTC(...)` fixture against
        # a hardcoded literal ('2026-01-06') really asserts "local == UTC" —
        # true on a stock UTC runner, false on a dev machine that isn't. CI
        # was structurally unable to see that class: green here while the
        # suite failed in Sydney (#540 finding 4 was the same, from UTC-10).
        #
        # Deliberately NOT a `TZ` pin in the vitest configs — that would make
        # the false assumption permanent rather than merely invisible. Tests
        # derive expected text from the same local-time path the formatter
        # uses (see charts' elapsed-axis / cursor-format tests); this leg is
        # what keeps them honest. `include` attaches to the two jobs that
        # already exist, so the guard costs no extra CI minutes.
        include:
          - node-version: 18.x
            tz: UTC
          - node-version: 24.x
            tz: Australia/Sydney

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build and tests
        run: npm run verify

      - name: Verify package contents
        if: matrix.node-version == '24.x'
        run: npm pack --dry-run --workspace=pond-ts --workspace=@pond-ts/process

  # pond-rs (docs/rfcs/pond-rs.md): format, lint and test the Rust workspace.
  # Needs no Node: the parity tests read the committed pond-ts fixtures
  # directly. `packages/core/test/parity-fixture.test.ts` (in `verify`) is what
  # keeps the core fixture in step with pond-ts.
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test without threads
        run: cargo test -p pond-rs --no-default-features

      # The RFC's later phases ship this same core to JS as WASM. Building for
      # wasm32 on every PR stops native-only code (threads, OS APIs) creeping
      # in un-gated long before that phase starts.
      - name: Build for WASM
        run: cargo check -p pond-rs --target wasm32-unknown-unknown --lib --examples

      # docs.rs builds the API docs from these comments; a broken link or an
      # undocumented public item fails here rather than on docs.rs.
      - name: Build API docs
        run: cargo doc -p pond-rs --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # What crates.io gets: the crate built from its packaged files alone.
      - name: Package
        run: cargo package -p pond-rs

  # @pond-ts/rs (docs/plans/PND_RUST_PLAN.md, R4): build crates/pond-wasm to
  # WebAssembly and run pond-ts's core parity fixture through the JS package.
  js-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Must match the wasm-bindgen version crates/pond-wasm pins.
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        run: packages/rs/build.sh

      - name: Core parity through JS
        run: node packages/rs/test/parity.mjs

      - name: Inputs the fixture does not cover
        run: node packages/rs/test/inputs.mjs

  # The oldest Rust pond-rs promises (`rust-version` in Cargo.toml).
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Build on the oldest supported Rust
        run: cargo check -p pond-rs --lib --examples --all-features

  # The Python bridge (crates/pond-py, PyPI `pond-rs`, `import pond_rs`):
  # one abi3 wheel for Python 3.9+, tested on the oldest and newest Python,
  # through the same core parity fixture the Rust crate passes.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Releases bump every package together; the wheel carries pond-ts's
      # version (crates/pond-py/Cargo.toml must match packages/core).
      - name: Check the version matches pond-ts
        run: |
          ts=$(node -p "require('./packages/core/package.json').version")
          py=$(grep -m1 '^version' crates/pond-py/Cargo.toml | cut -d '"' -f2)
          echo "pond-ts $ts, pond-py $py"
          test "$ts" = "$py"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m crates/pond-py/Cargo.toml --out dist

      - name: Install it with the test dependencies
        run: python -m pip install pytest pyarrow polars pandas numpy dist/*.whl

      - name: Test
        run: python -m pytest crates/pond-py/tests -q

  # The docs site builds from package **source** (TypeDoc's entry points), not
  # from `dist`, so it can break on a change that `npm run verify` is perfectly
  # happy with. Because `Docs` only ever runs on a `v*` tag, such a break used
  # to stay invisible until release day — [PND-SCANKERN] (#563) added Node-only
  # sources in July and the failure did not surface until the v0.54.0 tag weeks
  # later. This job runs the same build on every PR, minus the deploy, so the
  # breakage lands on the PR that causes it.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build packages
        # packages/core/dist is needed for @pond-ts/react's TypeDoc pass to
        # resolve the 'pond-ts' import (same reason as the Docs workflow).
        run: npm run build

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        # `prebuild` runs the TypeDoc API passes — the step that actually
        # compiles package source, and the one that broke at v0.54.0.
        working-directory: website
        run: npm run build
