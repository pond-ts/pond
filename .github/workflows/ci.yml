name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger — lets `verify` be run on demand (e.g. when push/PR event
  # delivery is disrupted, as after the pond-ts/pond org transfer). Mirrors the
  # workflow_dispatch the charts-e2e workflow already has.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 24.x
        # One leg runs east of UTC. Chart formatters render in the runner's
        # **local** zone, so a test pinning a `Date.UTC(...)` fixture against
        # a hardcoded literal ('2026-01-06') really asserts "local == UTC" —
        # true on a stock UTC runner, false on a dev machine that isn't. CI
        # was structurally unable to see that class: green here while the
        # suite failed in Sydney (#540 finding 4 was the same, from UTC-10).
        #
        # Deliberately NOT a `TZ` pin in the vitest configs — that would make
        # the false assumption permanent rather than merely invisible. Tests
        # derive expected text from the same local-time path the formatter
        # uses (see charts' elapsed-axis / cursor-format tests); this leg is
        # what keeps them honest. `include` attaches to the two jobs that
        # already exist, so the guard costs no extra CI minutes.
        include:
          - node-version: 18.x
            tz: UTC
          - node-version: 24.x
            tz: Australia/Sydney

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build and tests
        run: npm run verify

      - name: Verify package contents
        if: matrix.node-version == '24.x'
        run: npm pack --dry-run --workspace=pond-ts --workspace=@pond-ts/process

  # The docs site builds from package **source** (TypeDoc's entry points), not
  # from `dist`, so it can break on a change that `npm run verify` is perfectly
  # happy with. Because `Docs` only ever runs on a `v*` tag, such a break used
  # to stay invisible until release day — [PND-SCANKERN] (#563) added Node-only
  # sources in July and the failure did not surface until the v0.54.0 tag weeks
  # later. This job runs the same build on every PR, minus the deploy, so the
  # breakage lands on the PR that causes it.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build packages
        # packages/core/dist is needed for @pond-ts/react's TypeDoc pass to
        # resolve the 'pond-ts' import (same reason as the Docs workflow).
        run: npm run build

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        # `prebuild` runs the TypeDoc API passes — the step that actually
        # compiles package source, and the one that broke at v0.54.0.
        working-directory: website
        run: npm run build
