name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test and pack only; do not upload to npm'
        type: boolean
        default: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Publish to npm
        run: npm publish --access public --provenance --workspaces ${{ inputs.dry_run && '--dry-run' || '' }}

  # @pond-ts/rs: crates/pond-wasm built to WebAssembly (packages/rs), with
  # pond-ts's version. Not an npm workspace (building it needs Rust), so
  # `--workspaces` above leaves it out. Same auth: npm trusted publishing.
  publish-npm-rs:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Must match the wasm-bindgen version crates/pond-wasm pins.
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Check the version matches pond-ts and the tag
        run: |
          ts=$(node -p "require('./packages/core/package.json').version")
          rs=$(node -p "require('./packages/rs/package.json').version")
          echo "pond-ts $ts, @pond-ts/rs $rs, ref ${GITHUB_REF_NAME}"
          test "$ts" = "$rs"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then test "${GITHUB_REF_NAME}" = "v$rs"; fi

      # The tests need pond-ts (test/tojson.mjs), Playwright and Vite
      # (test/smoke.mjs) from the workspaces.
      - name: Install dependencies
        run: |
          npm ci
          npm run build --workspace=pond-ts
          npx playwright install --with-deps chromium

      - name: Build
        run: packages/rs/build.sh

      - name: Test (parity fixtures, then the packed package in Node and a browser)
        working-directory: packages/rs
        run: npm test

      - name: Publish to npm
        working-directory: packages/rs
        run: npm publish --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
